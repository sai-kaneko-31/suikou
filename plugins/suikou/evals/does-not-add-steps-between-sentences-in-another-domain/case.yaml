schema_version: "1.1"
name: does-not-add-steps-between-sentences-in-another-domain
expected_outcome: |
  The original has two sentences about a home appliance repair service: the customer writes the model number and the symptom in an input form (and what is written counts as one repair request), and a staff member inspects the device, makes an estimate and contacts the customer. The original does not say how the form reaches the staff or how the device reaches them. The reply rewrites the text without adding a step (sending the form, submitting it, sending in the device, receiving the request), a place or a condition for the staff's work that the original does not state. If it thinks a link between the two actions is needed, it says so in a question instead of writing the link into the text. It keeps the staff member's three actions and the rule about one request. This case has the same shape as does-not-add-steps-between-sentences but a different subject, to check that the rule does not depend on the library example.
