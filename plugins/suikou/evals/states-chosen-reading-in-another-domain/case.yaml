schema_version: "1.1"
name: states-chosen-reading-in-another-domain
expected_outcome: |
  The reply notices that "それが 1 件の申し込みです" can be read two ways (the items written on one reception slip together count as one request, or writing the item names on the slip is itself the request), and nothing in the prompt decides between them. It does not mark the sentence with a placeholder. It chooses the more likely reading, gives a complete rewritten text in that reading, and tells the writer in its questions which reading it chose and what the other reading is.
