schema_version: "1.1"
name: adds-connection-between-premise-and-consequence
expected_outcome: |
  The reply fixes the one place where two neighbouring sentences are a premise and its consequence but nothing says so: "在庫は月末に確定する決まりです。月初に集計すると、数字が合いません。" The reader has to work out by themselves that the second sentence follows from the first. The rewritten text shows the relation, either by joining the two sentences with a conjunctive particle such as ので or ため (for example 「決まりですので、月初に集計すると、数字が合いません」) or by putting a connective such as そのため at the start of the second sentence. The premise stays first and the consequence second. No reason, number or instruction that is not in the original is added (for example why stock is fixed at month end, or "月初は集計しないでください"). The other two sentences ("在庫の集計に関する注意点を、お知らせします。" and "集計結果は、共有フォルダの「月次」に入れてください。") stay as they are, with no connective added around them. The reply names the reason for the change: the relation between the two sentences was not shown.
